<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
  <!-- Sitting dachshund silhouette - clean black, white background -->
  <rect width="400" height="420" fill="white"/>
  <g fill="#111">
    <!-- Ear (long, hanging behind head) -->
    <ellipse cx="158" cy="162" rx="24" ry="55" transform="rotate(18 158 162)"/>
    <!-- Head -->
    <ellipse cx="130" cy="118" rx="55" ry="48"/>
    <!-- Snout -->
    <path d="M90 128 Q55 132 48 148 Q48 160 62 164 Q80 168 100 158 Q115 148 110 132 Z"/>
    <!-- Nose -->
    <ellipse cx="50" cy="152" rx="10" ry="8"/>
    <!-- Neck -->
    <path d="M120 158 Q140 175 155 178 Q175 180 185 170 Q175 152 155 148 Q138 145 120 158Z"/>
    <!-- Body - round sitting torso -->
    <ellipse cx="215" cy="255" rx="95" ry="85"/>
    <!-- Upper back connecting head to body -->
    <path d="M155 165 Q170 180 185 200 Q200 220 210 175 Q195 155 175 150 Z"/>
    <!-- Front left leg -->
    <rect x="148" y="315" width="30" height="80" rx="15"/>
    <!-- Front right leg -->
    <rect x="188" y="315" width="30" height="80" rx="15"/>
    <!-- Back haunch left -->
    <ellipse cx="155" cy="290" rx="35" ry="45" transform="rotate(-10 155 290)"/>
    <!-- Back haunch right -->
    <ellipse cx="280" cy="285" rx="42" ry="50" transform="rotate(10 280 285)"/>
    <!-- Back leg left paw -->
    <ellipse cx="148" cy="340" rx="28" ry="16"/>
    <!-- Back leg right paw area -->
    <ellipse cx="290" cy="340" rx="30" ry="16"/>
    <!-- Tail curving upward -->
    <path d="M295 215 Q335 185 325 145 Q320 128 308 133 Q313 150 310 172 Q306 196 278 218 Z"/>
    <!-- White eye -->
    <circle cx="108" cy="105" r="10" fill="white"/>
    <circle cx="108" cy="105" r="6" fill="#111"/>
    <circle cx="105" cy="102" r="2.5" fill="white"/>
    <!-- White chest line detail -->
    <path d="M148 185 Q155 220 158 265 Q160 290 148 310" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
